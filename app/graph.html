<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식그래프 뷰</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<link rel="stylesheet" href="/static/shell.css">
<style>
  #bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
         padding: 8px 18px; font-size: .82rem; border-bottom: 1px solid var(--line); }
  #bar input[type=search] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
                            background: #fff; color: var(--ink); width: 220px; }
  #bar label { display: flex; align-items: center; gap: 4px; color: var(--mut); cursor: pointer; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #wrap { display: flex; height: calc(100vh - 140px); }
  #net { flex: 1; }
  /* 클릭 상세 패널 (Neo4j Bloom / DataHub 방식) */
  #panel { width: 320px; border-left: 1px solid var(--line); padding: 14px 16px;
           overflow-y: auto; display: none; font-size: .85rem; }
  #panel.show { display: block; }
  #panel h3 { margin: 0 0 4px; font-size: .95rem; line-height: 1.4; }
  #panel .kv { color: var(--mut); margin: 8px 0; line-height: 1.7; }
  #panel .kv b { color: canvastext; font-variant-numeric: tabular-nums; }
  #panel .warnbox { border-left: 3px solid var(--fail); padding: 6px 10px;
                    background: color-mix(in srgb, var(--fail) 8%, canvas);
                    border-radius: 6px; margin: 8px 0; }
  #panel ul { padding-left: 16px; margin: 6px 0; }
  #panel li { margin: 3px 0; cursor: pointer; }
  #panel li:hover { color: var(--path); }
  #panel .close { float: right; cursor: pointer; border: 0; background: none;
                  color: var(--mut); font-size: 1rem; }
</style>
</head>
<body>
<header class="shell">
  <span class="brand">지식그래프 챗<small>조직의 문제 해결 경로</small></span>
  <nav class="pathnav">
    <a href="/">채팅</a><span class="edge"></span>
    <a class="on" href="/graph">지식그래프</a><span class="edge"></span>
    <a href="http://localhost:9002" target="_blank">DataHub ↗</a>
  </nav>
  <span class="spacer"></span>
  <button class="ghost" onclick="location.reload()">새로고침</button>
  <span id="who" style="display:none;font-size:12px;color:#8892a6;align-items:center;gap:8px"></span>
</header>
<script>
// SSO 로그인 사용자 표시 (AUTH_MODE=none이면 숨김 유지)
fetch("/me").then(r => r.json()).then(m => {
  if (m.auth_mode === "none" || !m.user) return;
  const w = document.getElementById("who");
  const name = document.createElement("b");
  name.textContent = m.user + (m.admin ? " (관리자)" : "");
  w.append(name);
  if (m.auth_mode === "keycloak") {  // header 모드 로그아웃은 전단 SSO 담당
    const out = document.createElement("a");
    out.href = "/oidc/logout"; out.textContent = "로그아웃";
    out.style.color = "inherit";
    w.append(out);
  }
  w.style.display = "inline-flex";
});
</script>

<div id="bar">
  <input type="search" id="find" placeholder="노드 검색 (Enter)">
  <label><input type="checkbox" id="showTools"> 행동(도구) 노드 표시</label>
  <label><input type="checkbox" id="failOnly"> 실패 이력만</label>
  <span class="spacer"></span>
  <span><i class="dot" style="background:#1e40af"></i>도메인</span>
  <span><i class="dot" style="background:#0891b2"></i>목표</span>
  <span><i class="dot" style="background:var(--ok)"></i>접근법</span>
  <span><i class="dot" style="background:#9ca3af"></i>도구</span>
  <span><i class="dot" style="background:var(--fail)"></i>실패 우세</span>
  <span style="color:var(--mut)">크기·선 굵기 = 사용 횟수</span>
</div>

<div id="wrap">
  <div id="net"></div>
  <aside id="panel"></aside>
</div>
<footer class="stats" id="stats"></footer>

<script>
const OK = getComputedStyle(document.documentElement).getPropertyValue("--ok").trim();
const FAIL = getComputedStyle(document.documentElement).getPropertyValue("--fail").trim();
const COLORS = {1: "#1e40af", 2: "#0891b2", 3: OK, 4: "#9ca3af"};
const LAYER_NAME = {1: "도메인", 2: "목표", 3: "접근법", 4: "행동/도구"};
let NODES = [], EDGES = [], net, vnodes, vedges;

fetch("/graph/data").then(r => r.json()).then(({nodes, edges}) => {
  NODES = nodes; EDGES = edges;
  document.getElementById("stats").innerHTML =
    `<span>노드 <b>${nodes.length}</b></span><span>연결 <b>${edges.length}</b></span>` +
    `<span>실패 우세 <b>${nodes.filter(n => n.fail).length}</b></span>`;
  build();
});

function visible(n) {
  if (!document.getElementById("showTools").checked && n.layer === 4) return false;
  if (document.getElementById("failOnly").checked && !(n.fail || n.layer <= 2)) return false;
  return true;
}

function build() {
  const shown = new Set(NODES.filter(visible).map(n => n.id));
  vnodes = new vis.DataSet(NODES.filter(n => shown.has(n.id)).map(n => ({
    id: n.id,
    label: n.name.length > 24 ? n.name.slice(0, 24) + "…" : n.name,
    color: {background: n.fail ? FAIL : COLORS[n.layer],
            border: n.fail ? FAIL : COLORS[n.layer],
            highlight: {background: "#f59e0b", border: "#b45309"}},
    font: {color: n.layer === 1 ? "#fff" : "#1f2430", size: n.layer === 1 ? 18 : 13},
    shape: n.layer === 1 ? "box" : "dot",
    size: Math.min(10 + n.uses * 3, 34),   /* 크기 = 사용 횟수 (Obsidian 방식) */
    mass: n.layer === 1 ? 3 : 1,
  })));
  vedges = new vis.DataSet(EDGES.filter(e => shown.has(e.src) && shown.has(e.dst))
    .map((e, i) => ({
      id: i, from: e.src, to: e.dst,
      width: Math.min(1 + e.count, 9),
      color: {opacity: .45}, arrows: {to: {scaleFactor: .5}},
      smooth: {type: "continuous"},
    })));
  net = new vis.Network(document.getElementById("net"), {nodes: vnodes, edges: vedges}, {
    physics: {  /* force-directed 배치 계산용 — 안정화 후 끔 */
      barnesHut: {gravitationalConstant: -6000, springLength: 130,
                  springConstant: 0.02, damping: 0.4},
      stabilization: {iterations: 200},
    },
    interaction: {hover: true, tooltipDelay: 120},
  });
  /* 배치가 끝나면 물리 정지 — 출렁임 없이 고정, 드래그하면 그 노드만 이동 */
  net.once("stabilizationIterationsDone", () => net.setOptions({physics: false}));
  net.on("click", p => p.nodes.length ? showPanel(p.nodes[0]) : hidePanel());
}

function showPanel(id) {
  const n = NODES.find(x => x.id === id);
  const nb = [];  // 연결 노드
  EDGES.forEach(e => {
    if (e.src === id) { const t = NODES.find(x => x.id === e.dst); if (t) nb.push({t, c: e.count, dir: "→"}); }
    if (e.dst === id) { const t = NODES.find(x => x.id === e.src); if (t) nb.push({t, c: e.count, dir: "←"}); }
  });
  const p = document.getElementById("panel");
  p.innerHTML = `<button class="close" onclick="hidePanel()">✕</button>
    <div style="color:var(--mut);font-size:.75rem">${LAYER_NAME[n.layer]}</div>
    <h3>${n.name}</h3>
    <div class="kv">사용 <b>${n.uses}</b>회 (문서 ${n.docs} · 대화 ${n.uses - n.docs}) · 성공 <b>${n.success}</b> · 실패 <b>${n.fail_cnt}</b></div>
    ${n.fail_reason ? `<div class="warnbox">⚠ ${n.fail_reason}</div>` : ""}
    <div style="font-weight:600;margin-top:10px">연결 (${nb.length})</div>
    <ul>${nb.sort((a, b) => b.c - a.c).map(x =>
      `<li onclick="focusNode('${x.t.id}')">${x.dir} ${x.t.name.slice(0, 40)} <span style="color:var(--mut)">(${x.c})</span></li>`).join("")}
    </ul>`;
  p.classList.add("show");
}
function hidePanel() { document.getElementById("panel").classList.remove("show"); }
function focusNode(id) {
  if (!vnodes.get(id)) { document.getElementById("showTools").checked = true; build(); }
  net.selectNodes([id]);
  net.focus(id, {scale: 1.1, animation: true});
  showPanel(id);
}

document.getElementById("showTools").onchange = build;
document.getElementById("failOnly").onchange = build;
document.getElementById("find").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const kw = e.target.value.trim().toLowerCase();
  if (!kw) return;
  const hit = NODES.find(n => n.name.toLowerCase().includes(kw));
  if (hit) focusNode(hit.id);
});
</script>
</body>
</html>
