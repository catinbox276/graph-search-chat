<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지식그래프 뷰</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #bar { padding: 8px 14px; font-size: .9rem; border-bottom: 1px solid #ddd;
         display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #net { height: calc(100vh - 42px); }
</style>
</head>
<body>
<div id="bar">
  <b>조직 지식그래프</b>
  <span><i class="dot" style="background:#1e40af"></i>1층 도메인</span>
  <span><i class="dot" style="background:#0891b2"></i>2층 목표</span>
  <span><i class="dot" style="background:#16a34a"></i>3층 접근법</span>
  <span><i class="dot" style="background:#9ca3af"></i>4층 행동</span>
  <span><i class="dot" style="background:#dc2626"></i>실패 표식</span>
  <span>선 굵기 = 가중치(통행 횟수)</span>
</div>
<div id="net"></div>
<script>
const COLORS = {1: "#1e40af", 2: "#0891b2", 3: "#16a34a", 4: "#9ca3af"};
fetch("/graph/data").then(r => r.json()).then(({nodes, edges}) => {
  const vnodes = nodes.map(n => ({
    id: n.id,
    label: n.name.length > 28 ? n.name.slice(0, 28) + "…" : n.name,
    title: n.name + (n.fail ? "\n⚠ " + (n.fail_reason || "실패") : ""),
    color: n.fail ? "#dc2626" : COLORS[n.layer],
    font: {color: "#fff", size: n.layer <= 2 ? 16 : 12},
    shape: n.layer === 1 ? "box" : "dot",
    size: n.layer === 2 ? 22 : n.layer === 3 ? 16 : 8,
    level: n.layer,
  }));
  const vedges = edges.map(e => ({
    from: e.src, to: e.dst, width: Math.min(1 + e.count, 10),
    label: e.count > 1 ? String(e.count) : undefined,
    font: {size: 11}, arrows: "to", color: {opacity: .6},
  }));
  new vis.Network(document.getElementById("net"),
    {nodes: vnodes, edges: vedges},
    {layout: {hierarchical: {direction: "LR", sortMethod: "directed",
                             levelSeparation: 320, nodeSpacing: 24}},
     physics: false, interaction: {hover: true}});
});
</script>
</body>
</html>
