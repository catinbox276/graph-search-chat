<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph-search-chat PoC</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 780px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; }
  #log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; line-height: 1.55; }
  .user { background: #3b82f6; color: #fff; align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .bot  { background: color-mix(in srgb, canvas 92%, canvastext); align-self: flex-start; max-width: 95%; }
  .steps { font-size: .8rem; border-left: 3px solid #3b82f6; padding-left: 8px;
           margin-bottom: 8px; }
  .steps:empty { display: none; }
  .steps details { margin: 3px 0; }
  .steps summary { cursor: pointer; opacity: .85; }
  .steps .detail-body { font-family: ui-monospace, monospace; font-size: .75rem;
                        white-space: pre-wrap; background: #0001; border-radius: 6px;
                        padding: 6px 8px; margin: 4px 0 6px; max-height: 260px;
                        overflow-y: auto; }
  .steps .sec { font-weight: 700; opacity: .7; }
  .elapsed { font-size: .75rem; opacity: .6; font-family: ui-monospace, monospace; }
  .body.streaming { white-space: pre-wrap; opacity: .8; }
  .body :is(h1,h2,h3) { font-size: 1rem; margin: .6em 0 .3em; }
  .body pre { background: #0002; padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
  .body code { font-family: ui-monospace, monospace; font-size: .88em; }
  .body table { border-collapse: collapse; }
  .body td, .body th { border: 1px solid #8886; padding: 4px 8px; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: canvas; padding: 8px 0; }
  input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #8884; font-size: 1rem; }
  button { padding: 10px 18px; border-radius: 8px; border: 0; background: #3b82f6; color: #fff; font-size: 1rem; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<h1>graph-search-chat PoC — DataHub MCP + 블로그 검색(Oracle)</h1>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="예: financial DB에서 계좌 테이블 뭐 있어? / pip이 프록시 뒤에서 안 돼" autofocus>
  <button id="b">전송</button>
</form>
<script>
let sid = null;
const log = document.getElementById("log"), f = document.getElementById("f"),
      q = document.getElementById("q"), b = document.getElementById("b");
const TOOL_LABEL = {
  suggest_paths: "과거 해결 경로 조회",
  search_blog: "사내 블로그 검색", read_blog_post: "블로그 글 읽기",
  search: "DataHub 테이블 검색", get_entities: "테이블 스키마 조회",
  list_schema_fields: "컬럼 목록 조회", get_lineage: "리니지 추적",
};
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  log.appendChild(d); d.scrollIntoView();
}
function addBot() {
  const d = document.createElement("div"); d.className = "msg bot";
  const steps = document.createElement("div"); steps.className = "steps";
  const body = document.createElement("div"); body.className = "body streaming";
  d.append(steps, body); log.appendChild(d);
  return {steps, body, d};
}
f.onsubmit = async (e) => {
  e.preventDefault();
  const msg = q.value.trim(); if (!msg) return;
  addUser(msg); q.value = ""; b.disabled = true;
  const {steps, body, d} = addBot();
  body.textContent = "🤔 질문 분석 중…";
  const pending = [];  // 결과 대기 중인 단계 블록
  let buf = "", raw = "";
  const render = () => { body.textContent = buf.slice(-800); d.scrollIntoView(false); };
  const addStep = (label, reasoning, args) => {
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "⚙ " + label;
    const bd = document.createElement("div");
    bd.className = "detail-body";
    bd.textContent = (reasoning ? "🧠 판단\n" + reasoning.trim() + "\n\n" : "")
                   + "📤 요청\n" + args;
    det.append(sum, bd);
    steps.appendChild(det);
    pending.push(bd);
    return det;
  };
  try {
    const r = await fetch("/chat/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sid, message: msg}),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      raw += dec.decode(value, {stream: true});
      let idx;
      while ((idx = raw.indexOf("\n\n")) >= 0) {
        const line = raw.slice(0, idx).replace(/^data: /, "");
        raw = raw.slice(idx + 2);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "session") sid = ev.session_id;
        else if (ev.type === "token") { buf += ev.text; render(); }
        else if (ev.type === "tool") {
          addStep(TOOL_LABEL[ev.name] || ev.name, buf,
                  JSON.stringify(ev.args, null, 1));
          buf = ""; body.textContent = "⏳ 도구 실행 중…";
          d.scrollIntoView(false);
        }
        else if (ev.type === "tool_end") {
          const bd = pending.shift();
          if (bd) bd.textContent += "\n\n📥 응답 (MCP/함수)\n" + (ev.result || "(빈 응답)");
          buf = ""; body.textContent = "✍️ 결과 검토 중…";
        }
        else if (ev.type === "answer") {
          body.classList.remove("streaming");
          body.innerHTML = marked.parse(ev.text || "(빈 답변)");
          if (steps.children.length) {
            const el = document.createElement("div");
            el.className = "elapsed"; el.textContent = `⏱ ${ev.elapsed_sec}s`;
            steps.appendChild(el);
          }
          d.scrollIntoView(false);
        }
        else if (ev.type === "error") {
          body.textContent = "오류: " + ev.message;
        }
      }
    }
  } catch (err) { body.textContent = "오류: " + err; }
  b.disabled = false; q.focus();
};
</script>
</body>
</html>
