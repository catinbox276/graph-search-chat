<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식그래프 챗</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="/static/shell.css">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 16px; min-height: calc(100vh - 110px); }
  #log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; line-height: 1.55; }
  .user { background: var(--path); color: #fff; align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .bot  { background: var(--card); align-self: flex-start; max-width: 95%; }
  .steps { font-size: .8rem; border-left: 3px solid var(--path); padding-left: 8px; margin-bottom: 8px; }
  .steps:empty { display: none; }
  .steps details { margin: 3px 0; }
  .steps summary { cursor: pointer; opacity: .85; }
  .steps summary.ok { color: var(--ok); }
  .steps .detail-body { font-family: ui-monospace, monospace; font-size: .75rem;
                        white-space: pre-wrap; background: #0001; border-radius: 6px;
                        padding: 6px 8px; margin: 4px 0 6px; max-height: 260px; overflow-y: auto; }
  .elapsed { font-size: .75rem; opacity: .6; font-family: ui-monospace, monospace; }
  .body.streaming { white-space: pre-wrap; opacity: .8; }
  .body :is(h1,h2,h3) { font-size: 1rem; margin: .6em 0 .3em; }
  .body pre { background: #0002; padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
  .body code { font-family: ui-monospace, monospace; font-size: .88em; }
  .body table { border-collapse: collapse; }
  .body td, .body th { border: 1px solid var(--line); padding: 4px 8px; }
  /* 빈 화면 = 행동으로의 초대 */
  #hello { text-align: center; padding: 48px 12px 12px; }
  #hello h2 { font-weight: 650; font-size: 1.15rem; margin-bottom: 4px; }
  #hello p { color: var(--mut); font-size: .88rem; margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chips button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
                  background: canvas; color: canvastext; font-size: .85rem; cursor: pointer; }
  .chips button:hover { border-color: var(--path); color: var(--path); }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: canvas; padding: 8px 0 14px; }
  input#q { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
            font-size: 1rem; background: canvas; color: canvastext; }
  button#b { padding: 10px 20px; border-radius: 10px; border: 0; background: var(--path);
             color: #fff; font-size: 1rem; cursor: pointer; }
  button#b:disabled { opacity: .5; }
</style>
</head>
<body>
<header class="shell">
  <span class="brand">지식그래프 챗<small>사내 데이터 · 노하우 어시스턴트</small></span>
  <nav class="pathnav">
    <a class="on" href="/">채팅</a><span class="edge"></span>
    <a href="/graph">지식그래프</a><span class="edge"></span>
    <a href="http://localhost:9002" target="_blank">DataHub ↗</a>
  </nav>
  <span class="spacer"></span>
  <select id="model" title="답변에 사용할 LLM"></select>
  <button class="ghost" id="newchat" title="기억을 비우고 새 대화 시작">새 대화</button>
</header>

<main>
  <div id="hello">
    <h2>무엇을 도와드릴까요?</h2>
    <p>데이터 위치·조인·리니지는 DataHub에서, 설치·설정 문제는 사내 블로그에서 찾아 답합니다.<br>
       비슷한 문제를 해결한 동료들의 검증된 경로가 있으면 먼저 안내합니다.</p>
    <div class="chips">
      <button>financial DB에서 계좌 분석하려면 어떤 테이블을 조인해?</button>
      <button>orders 테이블 데이터는 어디서 흘러들어와?</button>
      <button>pip install이 회사 프록시 뒤에서 안 돼</button>
      <button>도커 컨테이너 안에서 인터넷이 안 돼</button>
    </div>
  </div>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="질문을 입력하세요…" autofocus autocomplete="off">
    <button id="b">전송</button>
  </form>
</main>

<footer class="stats" id="stats"></footer>

<script>
let sid = null;
const $ = (id) => document.getElementById(id);
const log = $("log"), f = $("f"), q = $("q"), b = $("b"), hello = $("hello");

fetch("/models").then(r => r.json()).then(j => {
  j.llm.forEach(m => {
    const o = document.createElement("option");
    o.value = m.name; o.textContent = m.name + (m.default ? " (기본)" : "");
    if (m.default) o.selected = true;
    $("model").appendChild(o);
  });
});
fetch("/stats").then(r => r.json()).then(s => {
  $("stats").innerHTML =
    `<span>노하우 문서 <b>${s.posts.toLocaleString()}</b></span>` +
    `<span>그래프 노드 <b>${s.nodes.toLocaleString()}</b></span>` +
    `<span>축적 세션 <b>${s.sessions.toLocaleString()}</b></span>`;
});
$("newchat").onclick = () => { sid = null; log.innerHTML = ""; hello.style.display = ""; q.focus(); };
document.querySelectorAll(".chips button").forEach(c =>
  c.onclick = () => { q.value = c.textContent; f.requestSubmit(); });

const TOOL_LABEL = {
  suggest_paths: "과거 해결 경로 조회",
  search_blog: "사내 블로그 검색", read_blog_post: "블로그 글 읽기",
  search: "DataHub 테이블 검색", get_entities: "테이블 스키마 조회",
  list_schema_fields: "컬럼 목록 조회", get_lineage: "리니지 추적",
};
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  log.appendChild(d); d.scrollIntoView();
}
function addBot() {
  const d = document.createElement("div"); d.className = "msg bot";
  const steps = document.createElement("div"); steps.className = "steps";
  const body = document.createElement("div"); body.className = "body streaming";
  d.append(steps, body); log.appendChild(d);
  return {steps, body, d};
}
f.onsubmit = async (e) => {
  e.preventDefault();
  const msg = q.value.trim(); if (!msg) return;
  hello.style.display = "none";
  addUser(msg); q.value = ""; b.disabled = true;
  const {steps, body, d} = addBot();
  body.textContent = "🤔 질문 분석 중…";
  const pending = [];
  let buf = "", raw = "";
  const render = () => { body.textContent = buf.slice(-800); d.scrollIntoView(false); };
  const addStep = (label, reasoning, args) => {
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "⚙ " + label;
    const bd = document.createElement("div");
    bd.className = "detail-body";
    const think = (reasoning || "").trim();
    bd.textContent = (think ? "🧠 판단\n" + think + "\n\n" : "") + "📤 요청\n" + args;
    det.append(sum, bd);
    steps.appendChild(det);
    pending.push({bd, sum});
  };
  try {
    const r = await fetch("/chat/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sid, message: msg, model: $("model").value || null}),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      raw += dec.decode(value, {stream: true});
      let idx;
      while ((idx = raw.indexOf("\n\n")) >= 0) {
        const line = raw.slice(0, idx).replace(/^data: /, "");
        raw = raw.slice(idx + 2);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "session") sid = ev.session_id;
        else if (ev.type === "token") { buf += ev.text; render(); }
        else if (ev.type === "tool") {
          addStep(TOOL_LABEL[ev.name] || ev.name, buf, JSON.stringify(ev.args, null, 1));
          buf = ""; body.textContent = "⏳ 도구 실행 중…";
          d.scrollIntoView(false);
        }
        else if (ev.type === "tool_end") {
          const p = pending.shift();
          if (p) {
            p.bd.textContent += "\n\n📥 응답 (MCP/함수)\n" + (ev.result || "(빈 응답)");
            p.sum.classList.add("ok");  /* 완료된 단계 = 초록 (그래프의 '검증' 색) */
          }
          buf = ""; body.textContent = "✍️ 결과 검토 중…";
        }
        else if (ev.type === "answer") {
          body.classList.remove("streaming");
          body.innerHTML = marked.parse(ev.text || "(빈 답변)");
          if (steps.children.length) {
            const el = document.createElement("div");
            el.className = "elapsed"; el.textContent = `⏱ ${ev.elapsed_sec}s`;
            steps.appendChild(el);
          }
          d.scrollIntoView(false);
        }
        else if (ev.type === "error") { body.textContent = "오류: " + ev.message; }
      }
    }
  } catch (err) { body.textContent = "오류: " + err; }
  b.disabled = false; q.focus();
};
</script>
</body>
</html>
