# 클러스터 모드 — kubectl apply -k k8s/cluster
# Milvus/OpenSearch의 standalone/cluster 구분과 같은 방식. Oracle·모델 서빙은 모드 대상 아님.
# 기억은 Oracle 체크포인터로 외부화되어 세션 고정(sessionAffinity) 불필요 — 자유 라우팅.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target: {kind: Deployment, name: gsc-app}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
