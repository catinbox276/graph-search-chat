# 앱 파드 (프론트+백+MCP 클라이언트가 한 컨테이너 — 모놀리스)
# 기준 환경 = 사내 클러스터(하버 레지스트리). 환경설정은 gsc.env(configMapGenerator)에서 주입
apiVersion: v1
kind: Service
metadata:
  name: gsc-app
spec:
  type: LoadBalancer   # Docker Desktop: localhost:8500
  selector:
    app: gsc-app
  ports:
    - port: 8500
      targetPort: 8500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gsc-app
  template:
    metadata:
      labels:
        app: gsc-app
      annotations:
        # Kubeflow 프로필 네임스페이스의 Istio RBAC이 nginx 인그레스발 트래픽을
        # 사이드카에서 차단 → 주입 제외
        sidecar.istio.io/inject: "false"
    spec:
      imagePullSecrets:
        - name: harbor-cred      # 하버 pull 인증 (kubectl create secret docker-registry)
      containers:
        - name: app
          image: harbor.quantumcns.ai/user-dalgo/graph-search-chat:latest
          imagePullPolicy: Always  # 로컬 Docker Desktop 개발 시: 로컬 태그 + Never로 교체
          ports:
            - containerPort: 8500
          envFrom:
            - configMapRef:
                name: gsc-env    # gsc.env → ConfigMap (Oracle·모델·DataHub·Admin)
          readinessProbe:        # 기동 시 임베딩 행렬 1.4GB 로드 (1~3분)
            httpGet: {path: /stats, port: 8500}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          resources:
            requests: {memory: "3Gi"}
            limits: {memory: "5Gi"}
