<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식그래프 챗</title>
<script type="module">
  // marked를 CJK 친화 emphasis로 설정: `**라벨:**값`처럼 닫는 `**` 뒤에 공백 없이
  // 한글이 붙으면 CommonMark flanking 규칙상 굵게 처리 안 되는 문제를 고친다.
  // 확장이 marked 내부 토크나이저에 결합돼 있어 버전을 18로 고정한다 (확장 테스트 기준).
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@18/+esm";
  import cjkFriendly from "https://cdn.jsdelivr.net/npm/marked-cjk-friendly@0.1/+esm";
  marked.use(cjkFriendly());
  window.marked = marked;
</script>
<link rel="stylesheet" href="/static/shell.css">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 16px; min-height: calc(100vh - 110px); }
  #log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; line-height: 1.55; }
  .user { background: var(--path); color: #fff; align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .bot  { background: var(--card); align-self: flex-start; max-width: 95%; }
  .steps { font-size: .8rem; border-left: 3px solid var(--path); padding-left: 8px; margin-bottom: 8px; }
  .steps:empty { display: none; }
  .steps details { margin: 3px 0; }
  .steps summary { cursor: pointer; opacity: .85; }
  .steps summary.ok { color: var(--ok); }
  /* 에이전트 궤적 타임라인 — 판단(🧠) → 행동(도구) → 관찰(요약) */
  .tl-think { color: var(--mut); font-size: .76rem; margin: 6px 0 1px;
              font-style: italic; cursor: default; }
  .tl-step summary { display: flex; gap: 8px; align-items: baseline; list-style: none; }
  .tl-step summary::before { content: "▸"; opacity: .5; }
  .tl-step[open] summary::before { content: "▾"; }
  .tl-obs { color: var(--mut); font-size: .75rem; font-weight: 400;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-step summary.ok .tl-obs { color: inherit; opacity: .9; }
  .tl-time { margin-left: auto; font-family: ui-monospace, monospace;
             font-size: .7rem; opacity: .55; flex-shrink: 0; }
  .steps .detail-body { font-family: ui-monospace, monospace; font-size: .75rem;
                        white-space: pre-wrap; background: #0001; border-radius: 6px;
                        padding: 6px 8px; margin: 4px 0 6px; max-height: 260px; overflow-y: auto; }
  .elapsed { font-size: .75rem; opacity: .6; font-family: ui-monospace, monospace; }
  .body.streaming { opacity: .85; }
  .body :is(h1,h2,h3) { font-size: 1rem; margin: .6em 0 .3em; }
  .body pre { background: #0002; padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
  .body code { font-family: ui-monospace, monospace; font-size: .88em; }
  .body table { border-collapse: collapse; }
  .body td, .body th { border: 1px solid var(--line); padding: 4px 8px; }
  /* 빈 화면 = 행동으로의 초대 */
  #hello { text-align: center; padding: 48px 12px 12px; }
  #hello h2 { font-weight: 650; font-size: 1.15rem; margin-bottom: 4px; }
  #hello p { color: var(--mut); font-size: .88rem; margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chips button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
                  background: #fff; color: var(--ink); font-size: .85rem; cursor: pointer; }
  .chips button:hover { border-color: var(--path); color: var(--path); }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 14px; }
  input#q { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
            font-size: 1rem; background: #fff; color: var(--ink); }
  button#b { padding: 10px 20px; border-radius: 10px; border: 0; background: var(--path);
             color: #fff; font-size: 1rem; cursor: pointer; }
  button#b:disabled { opacity: .5; }
  .srcfoot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line);
             font-size: .78rem; color: var(--mut); }
  .srcfoot div { margin: 2px 0; }
  .srcfoot .doclink { cursor: pointer; text-decoration: underline dotted; }
  .srcfoot .doclink:hover { color: var(--path); }
  sup.cite { font-size: .7em; color: var(--acc, #2563eb); cursor: pointer; }
  /* 참고 문서 뷰 — 에이전트가 실제로 읽은 본문을 원문 이동 전에 확인 */
  dialog#docDlg { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px;
                  width: min(760px, 94vw); }
  dialog#docDlg::backdrop { background: #0006; }
  #docDlg h3 { margin: 0 0 4px; font-size: .98rem; line-height: 1.4; }
  #docDlg .dvmeta { color: var(--mut); font-size: .74rem; margin: 0 0 8px; }
  #dvBody { white-space: pre-wrap; max-height: 55vh; overflow-y: auto; font-size: .84rem;
            line-height: 1.6; background: #0001; border-radius: 8px; padding: 10px 12px; }
  #docDlg .dvact { display: flex; gap: 8px; margin-top: 12px; position: static; padding: 0; }
  #docDlg .dvact a, #docDlg .dvact button { padding: 7px 12px; border-radius: 8px;
            font-size: .85rem; cursor: pointer; text-decoration: none; }
  #docDlg .dvact a { background: var(--path); color: #fff; }
  #docDlg .dvact button { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  /* 대화 목록 패널 — 내 세션만, 클릭으로 이어하기 */
  #histPane { position: fixed; left: 0; top: 49px; bottom: 0; width: 272px; z-index: 5;
              background: var(--card); border-right: 1px solid var(--line);
              transform: translateX(-100%); transition: transform .15s ease; overflow-y: auto; }
  #histPane.open { transform: none; }
  #histPane h4 { margin: 12px 14px 6px; font-size: .8rem; color: var(--mut); font-weight: 600; }
  #histList { list-style: none; margin: 0; padding: 0 8px 12px; }
  #histList li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .84rem;
                 display: flex; flex-direction: column; gap: 2px; }
  #histList li:hover { background: #0001; }
  #histList li.on { background: var(--path); color: #fff; }
  #histList li.on small { color: #fffc; }
  #histList li b { font-weight: 500; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
  #histList li small { color: var(--mut); font-size: .72rem; }
  #histList .empty { color: var(--mut); cursor: default; }
</style>
</head>
<body>
<header class="shell">
  <span class="brand">지식그래프 챗<small>사내 데이터 · 노하우 어시스턴트</small></span>
  <nav class="pathnav">
    <a class="on" href="/">채팅</a><span class="edge"></span>
    <a href="/graph">지식그래프</a><span class="edge"></span>
    <a href="/contrib">내 기여</a><span class="edge"></span>
    <a href="/admin">관리</a><span class="edge"></span>
    <a href="http://localhost:9002" target="_blank">DataHub ↗</a>
  </nav>
  <span class="spacer"></span>
  <select id="model" title="답변에 사용할 LLM"></select>
  <button class="ghost" id="hist" title="내 대화 목록 — 클릭해서 이어하기">🕘 대화</button>
  <button class="ghost" id="newchat"
          title="기억을 비우고 새 대화 시작 — 다른 문제는 새 대화로 나누면 해결 경로가 지식그래프에 더 정확히 쌓입니다">새 대화</button>
  <span id="who" style="display:none;font-size:12px;color:#8892a6;align-items:center;gap:8px"></span>
</header>

<aside id="histPane">
  <h4>내 대화 <small>본인 세션만 보입니다</small></h4>
  <ul id="histList"></ul>
</aside>

<dialog id="docDlg">
  <h3 id="dvTitle">문서</h3>
  <p class="dvmeta" id="dvMeta"></p>
  <div id="dvBody"></div>
  <div class="dvact">
    <a id="dvUrl" target="_blank" rel="noopener noreferrer" style="display:none">원문 열기 ↗</a>
    <button type="button" id="dvClose">닫기</button>
  </div>
</dialog>

<main>
  <div id="hello">
    <h2>무엇을 도와드릴까요?</h2>
    <p>데이터 위치·조인·리니지는 DataHub에서, 설치·설정 문제는 사내 블로그에서 찾아 답합니다.<br>
       비슷한 문제를 해결한 동료들의 검증된 경로가 있으면 먼저 안내합니다.</p>
    <div class="chips">
      <button>financial DB에서 계좌 분석하려면 어떤 테이블을 조인해?</button>
      <button>orders 테이블 데이터는 어디서 흘러들어와?</button>
      <button>pip install이 회사 프록시 뒤에서 안 돼</button>
      <button>도커 컨테이너 안에서 인터넷이 안 돼</button>
    </div>
  </div>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="질문을 입력하세요…" autofocus autocomplete="off">
    <button id="b">전송</button>
  </form>
</main>

<footer class="stats" id="stats"></footer>

<script>
// 세션 만료(401) 공통 처리 — 모든 fetch에서 401이면 로그인 페이지로 안내 (재로그인 후 복귀)
(f => window.fetch = async (...a) => {
  const r = await f(...a);
  if (r.status === 401)
    location.href = "/login?next=" + encodeURIComponent(location.pathname) + "&expired=1";
  return r;
})(window.fetch);
let sid = null;
const $ = (id) => document.getElementById(id);
const log = $("log"), f = $("f"), q = $("q"), b = $("b"), hello = $("hello");

fetch("/models").then(r => r.json()).then(j => {
  j.llm.forEach(m => {
    const o = document.createElement("option");
    o.value = m.name; o.textContent = m.name + (m.default ? " (기본)" : "");
    if (m.default) o.selected = true;
    $("model").appendChild(o);
  });
});
fetch("/stats").then(r => r.json()).then(s => {
  $("stats").innerHTML =
    `<span>노하우 문서 <b>${s.posts.toLocaleString()}</b></span>` +
    `<span>그래프 노드 <b>${s.nodes.toLocaleString()}</b></span>` +
    `<span>축적 세션 <b>${s.sessions.toLocaleString()}</b></span>`;
});
// "내 기여" 등에서 ?session=<id>로 들어오면 그 대화를 바로 복원해 보여준다
{
  const sp = new URLSearchParams(location.search).get("session");
  if (sp) openSession(sp);
}
$("newchat").onclick = () => { sid = null; log.innerHTML = ""; hello.style.display = ""; turnCount = 0; splitHinted = false; topicSuppress = false; loadSessions(); q.focus(); };

// 대화 목록 — 내 세션만 조회, 클릭하면 복원 + 같은 세션으로 이어하기
const histPane = $("histPane");
$("hist").onclick = () => { histPane.classList.toggle("open"); if (histPane.classList.contains("open")) loadSessions(); };
async function loadSessions() {
  if (!histPane.classList.contains("open")) return;
  const r = await fetch("/sessions");
  if (!r.ok) return;
  const ul = $("histList");
  ul.innerHTML = "";
  const list = (await r.json()).sessions;
  if (!list.length) {
    const li = document.createElement("li");
    li.className = "empty"; li.textContent = "아직 대화가 없습니다";
    ul.appendChild(li); return;
  }
  list.forEach(s => {
    const li = document.createElement("li");
    if (s.id === sid) li.className = "on";
    const t = document.createElement("b"); t.textContent = s.title || "(제목 없음)";
    const meta = document.createElement("small");
    meta.textContent = `${s.turns}턴 · ${s.last_ts ? new Date(s.last_ts).toLocaleString("ko-KR", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}) : ""}`;
    li.append(t, meta);
    li.onclick = () => openSession(s.id);
    ul.appendChild(li);
  });
}
async function openSession(id) {
  const r = await fetch("/sessions/" + encodeURIComponent(id));
  if (!r.ok) return;
  const j = await r.json();
  sid = id; log.innerHTML = ""; hello.style.display = "none";
  j.turns.forEach(t => {
    addUser(t.question);
    const {steps, body} = addBot();
    // 저장된 도구 호출 기록으로 궤적 재생 (응답 원문은 저장 안 하므로 호출만)
    (t.tool_calls || []).forEach(c => {
      const det = document.createElement("details");
      det.className = "tl-step";
      const sum = document.createElement("summary");
      const lbl = document.createElement("span");
      lbl.textContent = `${TOOL_ICON[c.name] || "⚙"} ${TOOL_LABEL[c.name] || c.name}`;
      sum.appendChild(lbl);
      sum.classList.add("ok");
      const bd = document.createElement("div");
      bd.className = "detail-body";
      bd.textContent = "📤 요청\n" + JSON.stringify(c.args || {}, null, 1);
      det.append(sum, bd);
      steps.appendChild(det);
    });
    body.classList.remove("streaming");
    body.innerHTML = marked.parse(t.answer || "(빈 답변)");
    // 저장된 답변의 [문서id] 인용 토큰을 번호 각주로 (footer 데이터는 저장 안 하므로 번호만)
    const seen = [];
    body.innerHTML = body.innerHTML.replace(/\[([\w-]+:[\w.-]+)\]/g, (_m, pid) => {
      let n = seen.indexOf(pid) + 1;
      if (!n) { seen.push(pid); n = seen.length; }
      return `<sup class="cite" data-pid="${pid}" title="${pid}">[${n}]</sup>`;
    });
  });
  loadSessions(); q.focus();
}

// 참고 문서 사내 뷰 — 원문으로 보내기 전에 에이전트가 실제로 읽은 본문을 보여준다
const docDlg = $("docDlg");
$("dvClose").onclick = () => docDlg.close();
async function openDoc(pid) {
  $("dvTitle").textContent = "불러오는 중…";
  $("dvMeta").textContent = pid;
  $("dvBody").textContent = "";
  $("dvUrl").style.display = "none";
  docDlg.showModal();
  const r = await fetch("/doc/" + encodeURIComponent(pid)).catch(() => null);
  if (!r?.ok) { $("dvTitle").textContent = "문서를 불러올 수 없습니다"; return; }
  const doc = await r.json();
  $("dvTitle").textContent = doc.title || pid;
  $("dvMeta").textContent = `${doc.id}${doc.kind ? " · " + doc.kind : ""}${doc.source ? " · 소스: " + doc.source : ""}`;
  $("dvBody").textContent = doc.body || "(본문 없음)";
  if (/^https?:\/\//i.test(doc.url || "")) {  // 서버도 거르지만 심층 방어
    $("dvUrl").href = doc.url;
    $("dvUrl").style.display = "inline-block";
  }
}
// 답변 속 [n] 각주 클릭 → 해당 문서 뷰 (innerHTML 삽입이라 위임으로)
document.getElementById("log").addEventListener("click", (e) => {
  const s = e.target.closest("sup.cite[data-pid]");
  if (s) openDoc(s.dataset.pid);
});

// 로그인 사용자 표시
fetch("/me").then(r => r.json()).then(m => {
  if (!m.user) return;
  const w = $("who");
  const name = document.createElement("b");
  name.textContent = m.user + (m.admin ? " (관리자)" : "");
  const out = document.createElement("a");
  out.href = "/auth/logout"; out.textContent = "로그아웃";
  out.style.color = "inherit";
  w.append(name, out);
  w.style.display = "inline-flex";
});

document.querySelectorAll(".chips button").forEach(c =>
  c.onclick = () => { q.value = c.textContent; f.requestSubmit(); });

const TOOL_LABEL = {
  suggest_paths: "과거 해결 경로 조회",
  search_docs: "사내 문서 검색", read_doc: "문서 읽기",
  search_blog: "사내 문서 검색", read_blog_post: "문서 읽기",  // 구명 세션 재생 호환
  search: "DataHub 테이블 검색", get_entities: "테이블 스키마 조회",
  list_schema_fields: "컬럼 목록 조회", get_lineage: "리니지 추적",
};
const TOOL_ICON = {
  suggest_paths: "🧭", search_docs: "🔍", read_doc: "📖",
  search_blog: "🔍", read_blog_post: "📖",
  search: "🗄", get_entities: "🗄", list_schema_fields: "🗄",
  get_lineage: "🗄", get_dataset_queries: "🗄",
};
// 도구 응답을 타임라인용 한 줄 관찰 요약으로 (원문은 펼치면 그대로)
function obsSummary(name, r) {
  r = (r || "").trim();
  if (!r) return "빈 응답";
  if (r.startsWith("검색 결과가 없습니다")) return "0건";
  if (name === "suggest_paths") {
    if (r.includes("해결 이력이 그래프에 없")) return "유사 이력 없음 — 자유 접근";
    const v = (r.match(/✅/g) || []).length, dc = (r.match(/📄/g) || []).length,
          w = (r.match(/⚠/g) || []).length;
    return [v && `검증 경로 ${v}`, dc && `문서 근거 ${dc}`, w && `실패 이력 ${w}`]
      .filter(Boolean).join(" · ") || "결과 있음";
  }
  if (name.startsWith("search_"))
    return `히트 ${(r.match(/(^|\n)\[[^\]\n]+\]/g) || []).length}건`;
  if (name === "read_doc" || name === "read_blog_post") {
    if (r.startsWith("글을 찾을 수 없")) return "문서 없음";
    const t = (r.split("\n")[0] || "").replace(/^#\s*/, "");
    return `"${t.length > 34 ? t.slice(0, 34) + "…" : t}" 열람`;
  }
  const line = r.replace(/\s+/g, " ");
  return line.length > 44 ? line.slice(0, 44) + "…" : line;
}
function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  log.appendChild(d); d.scrollIntoView();
}
function addBot() {
  const d = document.createElement("div"); d.className = "msg bot";
  const steps = document.createElement("div"); steps.className = "steps";
  const body = document.createElement("div"); body.className = "body streaming";
  d.append(steps, body); log.appendChild(d);
  return {steps, body, d};
}
let turnCount = 0, splitHinted = false;
let topicSuppress = false;  // "이어서 진행" 선택 시 이 세션에서 다시 안 물음
let topicBypass = false;    // 확인 바에서 선택 후 재전송할 때 재확인 건너뜀

// 화제 분기 확인 바 — 다른 문제로 보이면 전송 전에 사용자에게 물어본다.
// 어느 쪽을 골라도 야간 세그먼트 분할이 2차 안전망으로 동작.
function showTopicBar() {
  const bar = document.createElement("div");
  bar.id = "topicBar";
  bar.style.cssText = "display:flex;gap:8px;align-items:center;justify-content:center;" +
    "flex-wrap:wrap;font-size:.82rem;padding:10px;margin:8px 0;border:1px solid var(--line);" +
    "border-radius:10px;background:color-mix(in srgb, var(--path) 6%, canvas)";
  const txt = document.createElement("span");
  txt.textContent = "🔀 새로운 문제로 보여요. 새 대화에서 시작할까요?";
  const mk = (label, fn, primary) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = label;
    btn.style.cssText = "padding:5px 12px;border-radius:8px;cursor:pointer;" +
      (primary ? "border:0;background:var(--path);color:#fff"
               : "border:1px solid var(--line);background:#fff;color:var(--ink)");
    btn.onclick = () => { bar.remove(); fn(); topicBypass = true; f.requestSubmit(); };
    return btn;
  };
  bar.append(txt,
    mk("새 대화로 시작", () => { sid = null; turnCount = 0; splitHinted = false; topicSuppress = false; }, true),
    mk("이어서 진행", () => { topicSuppress = true; }));
  log.appendChild(bar);
  bar.scrollIntoView(false);
}

f.onsubmit = async (e) => {
  e.preventDefault();
  const msg = q.value.trim(); if (!msg) return;
  // 이어지는 대화에서만, 세션당 1회 억제 규칙으로 화제 확인 (실패 시 조용히 진행)
  if (sid && !topicSuppress && !topicBypass) {
    try {
      const r = await fetch("/session/topic-check", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sid, question: msg})});
      if (r.ok && (await r.json()).shifted) { showTopicBar(); return; }  // 입력은 그대로 둠
    } catch {}
  }
  topicBypass = false;
  hello.style.display = "none";
  addUser(msg); q.value = ""; b.disabled = true;
  // 긴 세션 안내 (세션당 1회) — 태스크 단위로 나누면 그래프 자산화가 정확해짐
  if (++turnCount === 6 && !splitHinted) {
    splitHinted = true;
    const tip = document.createElement("div");
    tip.style.cssText = "font-size:.75rem;color:#8892a6;text-align:center;margin:6px 0";
    tip.textContent = "💡 다른 문제를 시작하신다면 '새 대화'로 나누면 해결 경로가 더 정확하게 기록됩니다";
    log.appendChild(tip);
  }
  const {steps, body, d} = addBot();
  body.textContent = "🤔 질문 분석 중…";
  const pending = [];
  let buf = "", raw = "", lastRender = 0, srcs = null;
  const mdRender = (text) => {
    // 열린 채 끝난 코드블록은 임시로 닫아 레이아웃 출렁임 방지
    const fences = (text.match(/```/g) || []).length;
    body.innerHTML = marked.parse(fences % 2 ? text + "\n```" : text);
  };
  const render = (force) => {
    const now = Date.now();
    if (!force && now - lastRender < 100) return;  // 100ms 스로틀
    lastRender = now;
    mdRender(buf);
    d.scrollIntoView(false);
  };
  const addStep = (name, reasoning, args) => {
    const think = (reasoning || "").trim();
    if (think) {  // 도구 선택 직전의 판단 — 타임라인 노드로
      const first = think.split("\n").map(l => l.trim()).find(Boolean) || "";
      const th = document.createElement("div");
      th.className = "tl-think";
      th.textContent = "🧠 " + (first.length > 88 ? first.slice(0, 88) + "…" : first);
      th.title = think.length > 800 ? think.slice(0, 800) + "…" : think;
      steps.appendChild(th);
    }
    const det = document.createElement("details");
    det.className = "tl-step";
    const sum = document.createElement("summary");
    const lbl = document.createElement("span");
    lbl.textContent = `${TOOL_ICON[name] || "⚙"} ${TOOL_LABEL[name] || name}`;
    const obs = document.createElement("span");
    obs.className = "tl-obs"; obs.textContent = "⏳ 실행 중…";
    const tm = document.createElement("span");
    tm.className = "tl-time";
    sum.append(lbl, obs, tm);
    const bd = document.createElement("div");
    bd.className = "detail-body";
    bd.textContent = (think ? "🧠 판단\n" + think + "\n\n" : "") + "📤 요청\n" + args;
    det.append(sum, bd);
    steps.appendChild(det);
    pending.push({bd, sum, obs, tm, name, t0: Date.now()});
  };
  try {
    const r = await fetch("/chat/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sid, message: msg, model: $("model").value || null}),
    });
    const reader = r.body.getReader(), dec = new TextDecoder();
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      raw += dec.decode(value, {stream: true});
      let idx;
      while ((idx = raw.indexOf("\n\n")) >= 0) {
        const line = raw.slice(0, idx).replace(/^data: /, "");
        raw = raw.slice(idx + 2);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "session") sid = ev.session_id;
        else if (ev.type === "token") { buf += ev.text; render(false); }
        else if (ev.type === "tool") {
          addStep(ev.name, buf, JSON.stringify(ev.args, null, 1));
          buf = ""; body.textContent = "⏳ 도구 실행 중…";
          d.scrollIntoView(false);
        }
        else if (ev.type === "tool_end") {
          const p = pending.shift();
          if (p) {
            p.bd.textContent += "\n\n📥 응답 (MCP/함수)\n" + (ev.result || "(빈 응답)");
            p.obs.textContent = "→ " + obsSummary(p.name, ev.result);
            p.tm.textContent = ((Date.now() - p.t0) / 1000).toFixed(1) + "s";
            p.sum.classList.add("ok");  /* 완료된 단계 = 초록 (그래프의 '검증' 색) */
          }
          buf = ""; body.textContent = "✍️ 결과 검토 중…";
        }
        else if (ev.type === "sources") srcs = ev.items;
        else if (ev.type === "answer") {
          body.classList.remove("streaming");
          mdRender(ev.text || "(빈 답변)");
          if (srcs?.length) {  // 결정적 footer — 이 턴에 실제 검색·열람된 문서 (서버 도구 기록 기반)
            // 답변 속 [문서id] 인용 토큰 → [n] 번호 각주로 치환.
            // 답변에 인용된 문서가 앞 번호를 받도록 정렬 (인용 안 된 문서는 뒤에)
            const html = body.innerHTML;
            srcs.sort((a, b) => html.includes(`[${a.id}]`) === html.includes(`[${b.id}]`)
                                ? 0 : html.includes(`[${a.id}]`) ? -1 : 1);
            let out = html;
            const escAttr = (s) => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
            srcs.forEach((s, i) => {
              out = out.replaceAll(`[${s.id}]`,
                `<sup class="cite" data-pid="${escAttr(s.id)}" title="${escAttr(s.title || s.id)}">[${i + 1}]</sup>`);
            });
            body.innerHTML = out;
            const foot = document.createElement("div");
            foot.className = "srcfoot";
            foot.append("📎 참고 문서 (클릭 = 에이전트가 읽은 본문 보기) ");
            srcs.forEach((s, i) => {
              const row = document.createElement("div");
              row.append(`[${i + 1}] ${s.kind === "열람" ? "📖 " : ""}`);
              const el = document.createElement("span");
              el.className = "doclink";
              el.onclick = () => openDoc(s.id);
              const t = s.title || s.id;
              el.textContent = t.length > 60 ? t.slice(0, 60) + "…" : t;
              el.title = t + "\n" + s.id + ` (${s.kind === "열람" ? "전문 열람" : s.kind}) — 클릭해서 본문 보기`;
              row.appendChild(el);
              foot.appendChild(row);
            });
            body.appendChild(foot);
          }
          if (steps.children.length) {
            const el = document.createElement("div");
            el.className = "elapsed";
            el.textContent = `✍ 답변 완료${srcs?.length ? ` · 출처 ${srcs.length}건` : ""} · ⏱ ${ev.elapsed_sec}s`;
            steps.appendChild(el);
          }
          d.scrollIntoView(false);
        }
        else if (ev.type === "error") { body.textContent = "오류: " + ev.message; }
      }
    }
  } catch (err) { body.textContent = "오류: " + err; }
  b.disabled = false; q.focus();
  loadSessions();  // 방금 턴이 목록에 반영되게
};
</script>
</body>
</html>
