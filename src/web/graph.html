<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식그래프 뷰</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<link rel="stylesheet" href="/static/shell.css">
<style>
  #bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
         padding: 8px 18px; font-size: .82rem; border-bottom: 1px solid var(--line); }
  #bar input[type=search] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
                            background: #fff; color: var(--ink); width: 220px; }
  #bar select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line);
                background: #fff; color: var(--ink); font-size: .82rem; }
  #bar label { display: flex; align-items: center; gap: 4px; color: var(--mut); cursor: pointer; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  #wrap { display: flex; height: calc(100vh - 140px); }
  #net { flex: 1; }
  /* 클릭 상세 패널 (Neo4j Bloom / DataHub 방식) */
  #panel { width: 320px; border-left: 1px solid var(--line); padding: 14px 16px;
           overflow-y: auto; display: none; font-size: .85rem; }
  #panel.show { display: block; }
  #panel h3 { margin: 0 0 4px; font-size: .95rem; line-height: 1.4; }
  #panel .kv { color: var(--mut); margin: 8px 0; line-height: 1.7; }
  #panel .kv b { color: canvastext; font-variant-numeric: tabular-nums; }
  #panel .warnbox { border-left: 3px solid var(--fail); padding: 6px 10px;
                    background: color-mix(in srgb, var(--fail) 8%, canvas);
                    border-radius: 6px; margin: 8px 0; }
  #panel ul { padding-left: 16px; margin: 6px 0; }
  #panel li { margin: 3px 0; cursor: pointer; }
  #panel li:hover { color: var(--path); }
  #panel .close { float: right; cursor: pointer; border: 0; background: none;
                  color: var(--mut); font-size: 1rem; }
</style>
</head>
<body>
<header class="shell">
  <span class="brand">지식그래프 챗<small>조직의 문제 해결 경로</small></span>
  <nav class="pathnav">
    <a href="/">채팅</a><span class="edge"></span>
    <a class="on" href="/graph">지식그래프</a><span class="edge"></span>
    <a href="/contrib">내 기여</a><span class="edge"></span>
    <a href="/admin">관리</a><span class="edge"></span>
    <a href="http://localhost:9002" target="_blank">DataHub ↗</a>
  </nav>
  <span class="spacer"></span>
  <button class="ghost" onclick="location.reload()">새로고침</button>
  <span id="who" style="display:none;font-size:12px;color:#8892a6;align-items:center;gap:8px"></span>
</header>
<script>
// 세션 만료(401) 공통 처리 — 모든 fetch에서 401이면 로그인 페이지로 안내 (재로그인 후 복귀)
(f => window.fetch = async (...a) => {
  const r = await f(...a);
  if (r.status === 401)
    location.href = "/login?next=" + encodeURIComponent(location.pathname) + "&expired=1";
  return r;
})(window.fetch);
// 로그인 사용자 표시
fetch("/me").then(r => r.json()).then(m => {
  if (!m.user) return;
  const w = document.getElementById("who");
  const name = document.createElement("b");
  name.textContent = m.user + (m.admin ? " (관리자)" : "");
  const out = document.createElement("a");
  out.href = "/auth/logout"; out.textContent = "로그아웃";
  out.style.color = "inherit";
  w.append(name, out);
  w.style.display = "inline-flex";
});
</script>

<div id="bar">
  <input type="search" id="find" placeholder="노드 검색 (Enter)">
  <select id="domSel"><option value="">도메인: 전체</option></select>
  <select id="layerSel">
    <option value="base">계층: 기본 (도구·엔티티 제외)</option>
    <option value="all">계층: 전체</option>
  </select>
  <label>최대 <input type="number" id="maxN" value="100" min="10" max="2000" step="10"
                     style="width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"> 노드</label>
  <label><input type="checkbox" id="failOnly"> 실패 이력만</label>
  <button class="ghost" id="spreadBtn" title="얽힌 배치를 다시 정렬">펼치기</button>
  <span class="spacer"></span>
  <span id="legend"></span>
  <span><i class="dot" style="background:var(--fail)"></i>실패 우세</span>
  <span style="color:var(--mut)">크기·선 굵기 = 사용 횟수</span>
</div>

<div id="wrap">
  <div id="net"></div>
  <aside id="panel"></aside>
</div>
<footer class="stats" id="stats"></footer>

<script>
const OK = getComputedStyle(document.documentElement).getPropertyValue("--ok").trim();
const FAIL = getComputedStyle(document.documentElement).getPropertyValue("--fail").trim();
// v2 층 배치: 1 도메인 · 2..7 계층 체인 (2=진입/목표) · 8 도구 · 9 속성 엔티티
const COLORS = {1: "#1e40af", 2: "#0891b2", 3: OK, 8: "#9ca3af", 9: "#c084fc"};
const CHAIN_PAL = ["#0891b2", OK, "#7c5cd6", "#d97706", "#db2777", "#0d9488"];  // 체인층 순환
const colorOf = l => COLORS[l] || CHAIN_PAL[(l - 2) % CHAIN_PAL.length];
const LAYER_NAME = {1: "도메인", 2: "목표", 3: "접근법", 8: "행동/도구", 9: "엔티티(타입)"};
const layerName = l => LAYER_NAME[l] || `체인 ${l - 1}단계`;
let NODES = [], EDGES = [], net, vnodes, vedges;
let PARENTS = {}, CHILDREN = {};  // 인접 맵 (조상 연결·도메인 서브트리용)

const _RUNQ = new URLSearchParams(location.search).get("run") || "";  // ?run=<id> = 그 run 관계 미리보기
fetch("/graph/data" + (_RUNQ ? "?relations_run=" + encodeURIComponent(_RUNQ) : ""))
  .then(r => r.json()).then(({nodes, edges, relations}) => {
  NODES = nodes;
  // 타입드 관계(점선)를 계층 엣지와 같은 배열에 합류 — 필터·이웃 확장이 자동 포함
  EDGES = edges.concat((relations || []).map(r => ({...r, isRel: true})));
  EDGES.forEach(e => {
    (PARENTS[e.dst] = PARENTS[e.dst] || []).push(e.src);
    (CHILDREN[e.src] = CHILDREN[e.src] || []).push(e.dst);
  });
  const sel = document.getElementById("domSel");
  nodes.filter(n => n.layer === 1).forEach(n => {
    const o = document.createElement("option");
    o.value = n.id; o.textContent = "도메인: " + n.name;
    sel.appendChild(o);
  });
  // 층 셀렉트·범례 — 데이터에 실제 있는 층으로 동적 생성 (체인 길이가 스키마마다 다름)
  const lays = [...new Set(nodes.map(n => n.layer))].sort((a, b) => a - b);
  const lsel = document.getElementById("layerSel");
  lays.forEach(l => {
    const o = document.createElement("option");
    o.value = l; o.textContent = layerName(l) + "만";
    lsel.appendChild(o);
  });
  const lg = document.getElementById("legend");
  lays.forEach(l => {
    const s = document.createElement("span");
    s.innerHTML = `<i class="dot" style="background:${colorOf(l)}"></i>${layerName(l)} `;
    lg.appendChild(s);
  });
  build();
});

// 선택 도메인의 서브트리 (BFS) — 없으면 null(전체)
function domainSubtree() {
  const root = document.getElementById("domSel").value;
  if (!root) return null;
  const seen = new Set([root]), q = [root];
  while (q.length) (CHILDREN[q.shift()] || []).forEach(c => {
    if (!seen.has(c)) { seen.add(c); q.push(c); }
  });
  return seen;
}

function visible(n, sub) {
  const lay = document.getElementById("layerSel").value;
  if (lay === "base" ? n.layer >= 8 : lay !== "all" && n.layer !== +lay) return false;  // 기본 뷰 = 도메인+체인(2..7), 도구8·엔티티9 제외
  if (sub && !sub.has(n.id)) return false;
  if (document.getElementById("failOnly").checked && !(n.fail || n.layer <= 2)) return false;
  return true;
}

// 표시할 노드 집합: 필터 → (검색 결과면 매칭+1홉 이웃) → 사용횟수 상위 max → 조상 사슬 보충
let SEARCH_IDS = null;  // 하이브리드 검색 결과 노드 id 집합 (null = 검색 안 함)
function currentSet() {
  const sub = domainSubtree();
  let cand = NODES.filter(n => visible(n, sub));
  if (SEARCH_IDS) {
    const nbr = new Set();
    EDGES.forEach(e => {
      if (SEARCH_IDS.has(e.src)) nbr.add(e.dst);
      if (SEARCH_IDS.has(e.dst)) nbr.add(e.src);
    });
    cand = cand.filter(n => SEARCH_IDS.has(n.id) || nbr.has(n.id));
  }
  const max = Math.max(10, +document.getElementById("maxN").value || 100);
  cand.sort((a, b) => b.uses - a.uses);
  const shown = new Set(cand.slice(0, max).map(n => n.id));
  // 잘린 그래프가 공중에 뜨지 않게 부모 사슬을 보충 (계층 단일 필터 땐 visible이 걸러줌)
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
  const q = [...shown];
  while (q.length) (PARENTS[q.pop()] || []).forEach(p => {
    if (!shown.has(p) && byId[p] && visible(byId[p], sub)) { shown.add(p); q.push(p); }
  });
  return shown;
}

function nodeSpec(n) {
  const nm = n.etype ? `${n.etype}: ${n.name}` : n.name;  // 엔티티(5층)는 타입 접두사
  return {
    id: n.id,
    title: `${layerName(n.layer)}${n.etype ? " · " + n.etype : ""}\n${n.name}\n사용 ${n.uses}회`
           + (n.docs ? ` · 문서 ${n.docs}` : "") + (n.success ? ` · 성공 ${n.success}` : ""),
    label: nm.length > 24 ? nm.slice(0, 24) + "…" : nm,
    color: {background: n.fail ? FAIL : colorOf(n.layer),
            border: n.fail ? FAIL : colorOf(n.layer),
            highlight: {background: "#f59e0b", border: "#b45309"}},
    font: {color: n.layer === 1 ? "#fff" : "#1f2430", size: n.layer === 1 ? 18 : 13},
    shape: n.layer === 1 ? "box" : "dot",
    size: Math.min(10 + n.uses * 3, 34),   /* 크기 = 사용 횟수 (Obsidian 방식) */
    mass: n.layer === 1 ? 3 : 1,
  };
}

function edgeSpec(e) {
  if (e.isRel) {   // 타입드 관계 — 점선 + 관계 타입 라벨
    return {
      id: e.src + "|" + e.dst + "|" + e.rtype, from: e.src, to: e.dst,
      width: Math.min(1 + e.count, 5), dashes: [4, 4],
      label: e.rtype, font: {size: 10, color: "#7c5cd6", align: "middle"},
      color: {color: "#c084fc", opacity: .7}, arrows: {to: {scaleFactor: .5}},
      smooth: {type: "continuous"},
    };
  }
  return {
    id: e.src + "|" + e.dst, from: e.src, to: e.dst,
    width: Math.min(1 + e.count, 9),
    color: {opacity: .45}, arrows: {to: {scaleFactor: .5}},
    smooth: {type: "continuous"},
  };
}

function build() {
  const shown = currentSet();
  const wantN = NODES.filter(n => shown.has(n.id)).map(nodeSpec);
  const wantE = EDGES.filter(e => shown.has(e.src) && shown.has(e.dst)).map(edgeSpec);
  if (!net) {
    vnodes = new vis.DataSet(wantN);
    vedges = new vis.DataSet(wantE);
    net = new vis.Network(document.getElementById("net"), {nodes: vnodes, edges: vedges}, {
      /* 물리는 상시 켜둠 — 필터·검색으로 노드가 바뀌면 힘 계산이 다시 돌아
         재배치가 애니메이션으로 보이고, 드래그하면 이웃이 따라 움직인다.
         damping↑·minVelocity↑ = 출렁임 억제 + 빨리 정지 (갱신 애니메이션은 유지) */
      physics: {
        barnesHut: {gravitationalConstant: -6000, springLength: 130,
                    springConstant: 0.02, damping: 0.6},
        minVelocity: 0.75,   /* 너무 높으면 시뮬이 즉시 잠들어 재정렬·드래그가 안 먹음 */
        stabilization: {iterations: 300},
      },
      interaction: {hover: true, tooltipDelay: 120},
    });
    net.on("click", p => p.nodes.length ? showPanel(p.nodes[0]) : hidePanel());
  } else {
    // 데이터셋 diff 갱신 — 남는 노드는 자리 유지, 신규만 물리로 흘러들어와 부드럽다
    const haveN = new Set(vnodes.getIds()), keepN = new Set(wantN.map(n => n.id));
    vnodes.remove([...haveN].filter(id => !keepN.has(id)));
    vnodes.update(wantN.filter(n => !haveN.has(n.id)));
    const haveE = new Set(vedges.getIds()), keepE = new Set(wantE.map(e => e.id));
    vedges.remove([...haveE].filter(id => !keepE.has(id)));
    vedges.update(wantE.filter(e => !haveE.has(e.id)));
    net.fit({animation: {duration: 600, easingFunction: "easeInOutQuad"}});
  }
  document.getElementById("stats").innerHTML =
    `<span>표시 <b>${wantN.length}</b> / 전체 <b>${NODES.length}</b> 노드</span>` +
    `<span>연결 <b>${wantE.length}</b></span>` +
    `<span>실패 우세 <b>${NODES.filter(n => n.fail).length}</b></span>`;
}

function showPanel(id) {
  const n = NODES.find(x => x.id === id);
  const nb = [];  // 연결 노드
  EDGES.forEach(e => {
    if (e.src === id) { const t = NODES.find(x => x.id === e.dst); if (t) nb.push({t, c: e.count, dir: "→"}); }
    if (e.dst === id) { const t = NODES.find(x => x.id === e.src); if (t) nb.push({t, c: e.count, dir: "←"}); }
  });
  const p = document.getElementById("panel");
  p.innerHTML = `<button class="close" onclick="hidePanel()">✕</button>
    <div style="color:var(--mut);font-size:.75rem">${layerName(n.layer)}</div>
    <h3>${n.name}</h3>
    <div class="kv">사용 <b>${n.uses}</b>회 (문서 ${n.docs} · 대화 ${n.uses - n.docs}) · 성공 <b>${n.success}</b> · 실패 <b>${n.fail_cnt}</b></div>
    ${n.fail_reason ? `<div class="warnbox">⚠ ${n.fail_reason}</div>` : ""}
    <div style="font-weight:600;margin-top:10px">연결 (${nb.length})</div>
    <ul>${nb.sort((a, b) => b.c - a.c).map(x =>
      `<li onclick="focusNode('${x.t.id}')">${x.dir} ${x.t.name.slice(0, 40)} <span style="color:var(--mut)">(${x.c})</span></li>`).join("")}
    </ul>
    <div style="font-weight:600;margin-top:10px">출처 증거</div>
    <ul id="evList"><li style="color:var(--mut)">불러오는 중…</li></ul>`;
  p.classList.add("show");
  loadEvidence(id);
}

// 출처 증거 — 이 노드가 어느 세션/문서에서 왔는지 (provenance)
const VERDICT_MARK = {success: "✅", fail: "❌", retracted: "↩", unknown: "―"};
async function loadEvidence(id) {
  const ul = document.getElementById("evList");
  try {
    const r = await fetch(`/graph/node/${encodeURIComponent(id)}/evidence`);
    if (!r.ok) { ul.innerHTML = "<li style='color:var(--mut)'>조회 실패</li>"; return; }
    const {evidence, total} = await r.json();
    ul.innerHTML = "";
    evidence.forEach(ev => {
      const li = document.createElement("li");
      li.style.cursor = "default";
      li.textContent = ev.kind === "doc"
        ? `📄 ${(ev.title || ev.ref).slice(0, 40)}`
        : `💬 세션 ${ev.ref.slice(0, 8)}… ${VERDICT_MARK[ev.verdict] || "―"}`;
      li.title = ev.ref;
      ul.appendChild(li);
    });
    if (total > evidence.length) {
      const li = document.createElement("li");
      li.style.cssText = "color:var(--mut);cursor:default";
      li.textContent = `… 외 ${total - evidence.length}건`;
      ul.appendChild(li);
    }
    if (!evidence.length) ul.innerHTML = "<li style='color:var(--mut)'>증거 없음</li>";
  } catch { ul.innerHTML = "<li style='color:var(--mut)'>조회 실패</li>"; }
}
function hidePanel() { document.getElementById("panel").classList.remove("show"); }
function focusNode(id) {
  // 필터에 걸러진 노드면 필터를 건드리지 않고 그 노드+연결 엣지만 즉석 추가
  if (!vnodes.get(id)) {
    const n = NODES.find(x => x.id === id);
    if (!n) return;
    vnodes.update(nodeSpec(n));
    vedges.update(EDGES.filter(e => (e.src === id && vnodes.get(e.dst)) ||
                                    (e.dst === id && vnodes.get(e.src))).map(edgeSpec));
  }
  net.selectNodes([id]);
  net.focus(id, {scale: 1.1, animation: {duration: 600, easingFunction: "easeInOutQuad"}});
  showPanel(id);
}

// 펼치기 — 현재 표시 노드로 레이아웃을 처음부터 다시 계산 (setData가 물리 안정화를 재실행)
function spread() {
  if (!net) return;
  net.setData({nodes: vnodes, edges: vedges});
  net.once("stabilizationIterationsDone", () =>
    net.fit({animation: {duration: 600, easingFunction: "easeInOutQuad"}}));
}
document.getElementById("spreadBtn").onclick = spread;

["domSel", "layerSel", "failOnly"].forEach(id =>
  document.getElementById(id).onchange = build);
document.getElementById("maxN").onchange = build;
document.getElementById("find").addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  const kw = e.target.value.trim();
  if (!kw) { SEARCH_IDS = null; build(); return; }  // 빈값 Enter → 전체 복귀
  // 서버 하이브리드 검색 (문서 검색과 동일: Kiwi 형태소 BM25 + 임베딩 코사인 RRF)
  // n = "최대 노드" 설정과 연동 — 상한을 올리면 검색 결과도 그만큼
  const r = await fetch("/graph/search?q=" + encodeURIComponent(kw) +
                        "&n=" + (+document.getElementById("maxN").value || 100));
  const {ids} = await r.json();
  SEARCH_IDS = new Set(ids);
  build();
  spread();  // 검색 결과는 옛 자리에 뭉쳐 보일 수 있어 자동으로 다시 정렬
  const top = ids.find(id => vnodes.get(id));  // 순위 1위 노드 선택·패널
  if (top) { net.selectNodes([top]); showPanel(top); }
  else if (!ids.length) hidePanel();
});
</script>
</body>
</html>
