# PoC 게이트웨이 SSO 미들웨어 시뮬레이터 — 사내 구조(게이트웨이 검증 API) 리허설용.
# 앱과 같은 이미지, uvicorn 진입점만 다름. 사내 전환 시 이 파드는 배포하지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-sim
  template:
    metadata:
      labels:
        app: gateway-sim
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: sim
          image: harbor.quantumcns.ai/user-dalgo/graph-search-chat:latest
          imagePullPolicy: Always
          command: ["uvicorn", "app.gateway_sim:app", "--host", "0.0.0.0", "--port", "8600"]
          ports:
            - containerPort: 8600
          envFrom:
            - configMapRef:
                name: gsc-env
          readinessProbe:
            httpGet: {path: /healthz, port: 8600}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-sim
spec:
  selector:
    app: gateway-sim
  ports:
    - port: 8600
      targetPort: 8600
