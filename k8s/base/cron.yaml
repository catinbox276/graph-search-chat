# 야간 배치 — 앱과 같은 이미지 사용 (둘 다 이어하기/멱등이라 재실행 안전)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: graph-pipeline
spec:
  schedule: "0 3 * * *"   # 매일 03:00 — 미판정 세션 게이트→추출→그래프 반영
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"   # 사이드카가 남으면 Job이 안 끝난다
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: harbor-cred
          containers:
            - name: pipeline
              image: harbor.quantumcns.ai/user-dalgo/graph-search-chat:latest
              imagePullPolicy: Always   # 로컬 Docker Desktop 개발 시: 로컬 태그 + Never
              command: ["python", "-m", "poc.graph_pipeline"]
              envFrom:
                - configMapRef:
                    name: gsc-env
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-sources
spec:
  schedule: "10 3 * * *"   # 매일 03:10 — 등록 원천 테이블 증분 적재 → corpus_docs
