# 앱 파드 (프론트+백+MCP 클라이언트가 한 컨테이너 — 모놀리스)
# 사내 전환: image를 레지스트리 경로로. 환경설정은 gsc.env(configMapGenerator)에서 주입
apiVersion: v1
kind: Service
metadata:
  name: gsc-app
spec:
  type: LoadBalancer   # Docker Desktop: localhost:8500
  selector:
    app: gsc-app
  ports:
    - port: 8500
      targetPort: 8500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gsc-app
  template:
    metadata:
      labels:
        app: gsc-app
    spec:
      containers:
        - name: app
          image: graph-search-chat:latest
          imagePullPolicy: Never   # 로컬 빌드 이미지. 사내에선 레지스트리로
          ports:
            - containerPort: 8500
          envFrom:
            - configMapRef:
                name: gsc-env    # gsc.env → ConfigMap (Oracle·모델·DataHub·Admin)
          readinessProbe:        # 기동 시 임베딩 행렬 1.4GB 로드 (1~3분)
            httpGet: {path: /stats, port: 8500}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          resources:
            requests: {memory: "3Gi"}
            limits: {memory: "5Gi"}
