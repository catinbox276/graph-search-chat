# 앱 파드 (프론트+백+MCP 클라이언트가 한 컨테이너 — 모놀리스)
# 사내 전환: image를 레지스트리 경로로, MODEL_URL을 vLLM 서비스로 교체
apiVersion: v1
kind: Service
metadata:
  name: gsc-app
spec:
  type: LoadBalancer   # Docker Desktop: localhost:8500
  selector:
    app: gsc-app
  ports:
    - port: 8500
      targetPort: 8500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gsc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gsc-app
  template:
    metadata:
      labels:
        app: gsc-app
    spec:
      containers:
        - name: app
          image: graph-search-chat:latest
          imagePullPolicy: Never   # 로컬 빌드 이미지. 사내에선 레지스트리로
          ports:
            - containerPort: 8500
          env:
            - name: ORACLE_DSN
              value: oracle:1521/FREEPDB1          # 파드 간 서비스 DNS
            - name: MODEL_URL
              value: http://host.docker.internal:1234/v1   # LM Studio (호스트 잔류)
            - name: DATAHUB_GMS_URL
              value: http://datahub-datahub-gms:8080       # 클러스터 내부 DNS (helm)
            - name: ADMIN_TOKEN
              value: poc-admin   # ponytail: PoC 평문. 사내는 Secret+SSO
          readinessProbe:        # 기동 시 임베딩 행렬 1.4GB 로드 (1~3분)
            httpGet: {path: /stats, port: 8500}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          resources:
            requests: {memory: "3Gi"}
            limits: {memory: "5Gi"}
