# Keycloak (PoC SSO) — start-dev + realm 자동 임포트. 같은 인그레스의 /auth 경로로 서빙.
#
# 사내 Keycloak 전환 시: 이 파일을 배포하지 않고 gsc.env의 KEYCLOAK_*·OIDC_*만
# 사내 값으로 교체하면 된다 (앱은 표준 OIDC 코드 플로우만 사용 — app/auth.py).
#
# PoC 한정 사항 (사내 전환 시 정리):
#   - start-dev + 내장 H2 (emptyDir) — 재시작 시 Keycloak 내 변경분은 사라지고
#     아래 realm ConfigMap이 다시 임포트된다. 사용자·클라이언트의 원본은 이 파일.
#   - 관리자·시드 사용자 비밀번호 평문 — Secret 분리 대상.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Kubeflow 프로필 네임스페이스의 Istio RBAC이 nginx 인그레스발 트래픽을
        # 사이드카에서 차단 → gsc-app과 동일하게 주입 제외 (인그레스로 직접 서빙)
        sidecar.istio.io/inject: "false"
    spec:
      imagePullSecrets:
        - name: harbor-cred   # 하버 pull 인증 (gsc-app과 동일)
      containers:
        - name: keycloak
          # quay.io 원본을 하버로 미러 (클러스터 노드의 외부 레지스트리 의존 제거)
          image: harbor.quantumcns.ai/user-dalgo/keycloak:26.3
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: poc-admin1234
            # 같은 호스트의 /auth 하위 경로로 서빙 (인그레스 경로 라우팅과 짝)
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HOSTNAME
              value: http://gsc-dalgo.quantumcns.ai/auth
            # 앱 파드가 클러스터 내부 DNS(keycloak:8080)로 토큰 교환할 수 있게 허용
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /auth/realms/gsc
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {memory: "512Mi"}
            limits: {memory: "1Gi"}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
# gsc realm 원본 — 클라이언트(gsc-app)·역할(gsc-admin/gsc-user)·시드 사용자 2명.
# 여기 값이 gsc.env의 OIDC_CLIENT_ID/OIDC_CLIENT_SECRET와 짝이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  gsc-realm.json: |
    {
      "realm": "gsc",
      "enabled": true,
      "registrationAllowed": false,
      "roles": {
        "realm": [
          {"name": "gsc-admin", "description": "그래프서치챗 관리자 (모델·도메인 관리)"},
          {"name": "gsc-user", "description": "그래프서치챗 사용자"}
        ]
      },
      "clients": [
        {
          "clientId": "gsc-app",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "gsc-oidc-secret-poc",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["http://gsc-dalgo.quantumcns.ai/*", "http://localhost:8500/*"],
          "webOrigins": ["+"]
        }
      ],
      "users": [
        {
          "username": "dalgo",
          "enabled": true,
          "email": "dalgo@quantumcns.ai",
          "emailVerified": true,
          "credentials": [{"type": "password", "value": "dalgo1234", "temporary": false}],
          "realmRoles": ["gsc-admin", "gsc-user"]
        },
        {
          "username": "analyst1",
          "enabled": true,
          "emailVerified": true,
          "credentials": [{"type": "password", "value": "analyst1234", "temporary": false}],
          "realmRoles": ["gsc-user"]
        }
      ]
    }
