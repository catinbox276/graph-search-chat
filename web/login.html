<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식그래프 챗 — 로그인</title>
<link rel="stylesheet" href="/static/shell.css">
<style>
  main { max-width: 380px; margin: 8vh auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 22px; margin-bottom: 14px; }
  h2 { font-size: 1.05rem; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--mut); font-size: .8rem; text-align: center; margin: 0 0 16px; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
          font-size: .92rem; background: #fff; color: var(--ink); }
  button { padding: 10px; border-radius: 8px; border: 0; background: var(--path);
           color: #fff; font-size: .92rem; cursor: pointer; }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .msg { font-size: .8rem; min-height: 1.2em; margin-top: 6px; text-align: center; }
  .msg.err { color: var(--fail); } .msg.ok { color: var(--ok); }
  .toggle { text-align: center; font-size: .8rem; color: var(--mut); margin-top: 10px; }
  .toggle a { color: var(--path); cursor: pointer; }
  #signupCard { display: none; }
</style>
</head>
<body>
<main>
  <div class="card" id="loginCard">
    <h2>지식그래프 챗</h2>
    <p class="sub">사내 데이터 · 노하우 어시스턴트</p>
    <form id="lf">
      <input id="lid" placeholder="아이디" autocomplete="username" required autofocus>
      <input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button>로그인</button>
    </form>
    <p class="msg err" id="lmsg"></p>
    <p class="toggle">계정이 없으면 <a id="showSignup">회원가입</a></p>
  </div>

  <div class="card" id="signupCard">
    <h2>회원가입</h2>
    <p class="sub">가입 후 관리자 승인이 완료되면 로그인할 수 있습니다</p>
    <form id="sf">
      <input id="sid" placeholder="아이디 (영문/숫자/._- 2~32자)" autocomplete="username" required>
      <input id="spw" type="password" placeholder="비밀번호 (4자 이상)" autocomplete="new-password" required>
      <input id="spw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" required>
      <button>가입 신청</button>
    </form>
    <p class="msg" id="smsg"></p>
    <p class="toggle"><a id="showLogin">← 로그인으로</a></p>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const next = new URLSearchParams(location.search).get("next") || "/";
$("showSignup").onclick = () => { $("loginCard").style.display = "none"; $("signupCard").style.display = "block"; $("sid").focus(); };
$("showLogin").onclick = () => { $("signupCard").style.display = "none"; $("loginCard").style.display = "block"; $("lid").focus(); };

$("lf").onsubmit = async (e) => {
  e.preventDefault();
  $("lmsg").textContent = "";
  const r = await fetch("/auth/login", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: $("lid").value.trim(), password: $("lpw").value})});
  if (!r.ok) {
    let msg = `로그인 실패 (${r.status})`;
    try { msg = (await r.json()).detail; } catch {}
    $("lmsg").textContent = msg; return;
  }
  // 내부 경로만 허용 — //·/\ 는 브라우저가 외부 호스트로 해석 (open redirect 차단)
  location.href = /^\/(?![/\\])/.test(next) ? next : "/";
};

$("sf").onsubmit = async (e) => {
  e.preventDefault();
  const m = $("smsg"); m.textContent = ""; m.className = "msg";
  if ($("spw").value !== $("spw2").value) {
    m.textContent = "비밀번호 확인이 일치하지 않습니다"; m.classList.add("err"); return;
  }
  const r = await fetch("/auth/signup", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: $("sid").value.trim(), password: $("spw").value})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { m.textContent = j.detail || `가입 실패 (${r.status})`; m.classList.add("err"); return; }
  m.textContent = "✓ " + (j.note || "가입 완료"); m.classList.add("ok");
};
</script>
</body>
</html>
